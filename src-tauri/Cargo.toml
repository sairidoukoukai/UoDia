[package]
name = "uodia"
version = "1.2.0"
description = "大阪大学 学内連絡バス（再履バス）ダイヤグラム設計ソフトウェア"
# `.deb` の `Maintainer` と `.rpm` の `Packager` はここから作られる。**`bundle.publisher`
# より優先される**——実際に作った 1.0.0 の control は `Maintainer: sairidoukoukai` であり、
# `tauri.conf.json` を直しただけでは配布物の表記が変わらなかった（#158）。
authors = ["再履バス同好会"]
edition = "2021"
rust-version = "1.77.2"

# Rust 側の責務はファイル I/O のみに限定する（仕様書 §10.3）。
# ドメインロジックは TypeScript 側で完結させ、Web 版と共通化する。

[lib]
name = "uodia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
